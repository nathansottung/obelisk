name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The integration tests drive the real restore doctrine (par2 -> gpg -> tar),
      # so the tools must be present or the tests will t.Skip. tar ships with the
      # runner; gnupg provides gpg, par2 provides par2.
      - name: Install restore tools
        run: sudo apt-get update && sudo apt-get install -y gnupg par2

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

      # The race detector needs cgo (a C toolchain), which the Ubuntu runner has but
      # the CGO_ENABLED=0 release build deliberately does not. Run it here so every
      # push/PR is checked for data races even though release binaries stay pure-Go.
      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...
