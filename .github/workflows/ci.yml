name: CI

# Runs on branch pushes and pull requests. Release calls it as a reusable workflow
# (workflow_call) for the tagged commit, so tag pushes do not trigger it twice.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # Use exactly the Go that setup-go installs from go.mod's toolchain line.
  GOTOOLCHAIN: local

jobs:
  linux:
    name: Linux (vet, build, test, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go version from go.mod
        id: go
        run: bash scripts/ci/go-version.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      # The integration tests drive the real restore doctrine (par2 -> gpg -> tar),
      # so the tools must be present or the tests will t.Skip. tar ships with the
      # runner; gnupg provides gpg, par2 provides par2.
      - name: Install restore tools
        run: sudo apt-get update && sudo apt-get install -y gnupg par2

      - name: Tool versions
        run: |
          go version
          tar --version | head -n 1
          gpg --version | head -n 1
          par2 -V | head -n 1

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

      # Navigation performance budget for the Archives folder tree: expanding the
      # widest folder of a ~200k-file catalog must stay under 100ms server compute and
      # 50KB payload (TestTreeExpansionBudget). The OBELISK_PERF gate only exempts a
      # quick local `go test`; here it is enforced on every push. NOT continue-on-error.
      - name: tree-expansion budget
        run: OBELISK_PERF=1 go test -run TestTreeExpansionBudget -v ./...

      # The race detector needs cgo (a C toolchain), which the Ubuntu runner has but
      # the CGO_ENABLED=0 release build deliberately does not. Run it here so every
      # push/PR is checked for data races even though release binaries stay pure-Go.
      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...

      # Prose lint: warns on print-worn, wordy, or passive phrasing in user-facing
      # UI strings and docs (the Writing standard in docs/CONTRIBUTING.md). Advisory
      # only — continue-on-error keeps it from blocking a merge; it surfaces findings
      # as an annotation so the standard is visible on every PR.
      - name: prose-lint (advisory)
        continue-on-error: true
        run: bash scripts/prose-lint

  windows:
    name: Windows (test with known-failure gate, guionly build and vet)
    runs-on: windows-latest
    env:
      PAR2_URL: https://github.com/Parchive/par2cmdline/releases/download/v1.4.0/par2cmdline-1.4.0-win-x64.zip
      PAR2_SHA512: e6e7048e3e1d2b7077c196ef37f38a266848f29021aaa676fa9fabffc9302073d9c8bae41dfd6b5122c76618432e3e544e0e94e5f9128dd867ef66b743088441
      GNUPG_URL: https://www.gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.22_20260831.exe
      GNUPG_SHA256: 2e5841e345d56f05199351bfcf585d28c6dc2326c8f76962f1e402f41f6d10e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go version from go.mod
        id: go
        shell: bash
        run: bash scripts/ci/go-version.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install par2 1.4.0 (official release, SHA-512 checked)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'par2cmdline-1.4.0-win-x64.zip'
          Invoke-WebRequest -Uri $env:PAR2_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA512 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:PAR2_SHA512) { throw "par2 SHA-512 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'par2')

      - name: Install GnuPG 2.5.22 (official installer, SHA-256 checked)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'gnupg-w32-2.5.22_20260831.exe'
          Invoke-WebRequest -Uri $env:GNUPG_URL -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($hash -ne $env:GNUPG_SHA256) { throw "GnuPG SHA-256 mismatch: $hash" }
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GnuPG installer exit code $($p.ExitCode)" }
          $gpg = Get-ChildItem 'C:\Program Files\GnuPG\bin\gpg.exe', 'C:\Program Files (x86)\GnuPG\bin\gpg.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gpg) { throw 'gpg.exe not found after install' }
          "GNUPG_BIN=$($gpg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # System32 tar (bsdtar) first; Git's MSYS tar, gpg, bash and coreutils are
      # not on PATH. The exit code is judged by the known-failure gate below.
      - name: go test (System32 tar, no MSYS tools)
        shell: pwsh
        run: |
          $goBin = Split-Path (Get-Command go.exe).Source
          $env:Path = @("$env:SystemRoot\System32", $env:SystemRoot, "$env:SystemRoot\System32\Wbem", $env:GNUPG_BIN, (Join-Path $env:RUNNER_TEMP 'par2'), $goBin) -join ';'
          $msys = $env:Path -split ';' | Where-Object { $_ -match '\\Git\\|msys|mingw|cygwin' }
          if ($msys) { throw "MSYS/Git directories on PATH: $msys" }
          foreach ($t in 'tar', 'gpg', 'par2', 'go') { "{0} -> {1}" -f $t, (Get-Command "$t.exe").Source }
          if ((Get-Command tar.exe).Source -ne "$env:SystemRoot\System32\tar.exe") { throw 'tar is not System32 tar' }
          tar --version
          gpg --version | Select-Object -First 1
          par2 -V | Select-Object -First 1
          go test -json -count=1 ./... > go-test.json
          "go test exit code $LASTEXITCODE; judged by the known-failure gate"
          exit 0

      - name: Known-failure gate
        shell: pwsh
        run: node scripts/ci/go-known-failures.mjs go-test.json

      - name: Upload go test JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-go-test-json
          path: go-test.json
          if-no-files-found: warn

      - name: go build -tags guionly
        run: go build -tags guionly ./...

      - name: go vet -tags guionly
        run: go vet -tags guionly ./...

  node:
    name: Node suites (gui-preview, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go version from go.mod
        id: go
        shell: bash
        run: bash scripts/ci/go-version.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Builds the reader and test doubles, generates every fixture set beneath
      # %LOCALAPPDATA%\ObeliskDev, runs all eight gui-preview suites and
      # syntax-checks scripts/windows-alpha (whose suites need a built package).
      - name: Fixtures and gui-preview suites
        run: node scripts/ci/node-suites.mjs
