name: Release

# Cut a release by pushing a version tag:  git tag v0.9.0 && git push --tags
# The tag is the single source of the version: it is injected into the binary via
# -ldflags "-X main.appVersion=${TAG}" and into the image via VERSION / metadata-action.
#
# Guard:
# - The full CI workflow runs on the tagged commit first; nothing is built or
#   published unless every CI job passes.
# - vX.Y.Z publishes a normal release, marked latest, and moves the image's
#   :latest and :X.Y tags.
# - vX.Y.Z-<suffix> publishes a prerelease that is never marked latest and never
#   moves :latest or :X.Y.
# - Any other v* tag is refused.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  tag:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Classify tag
        id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$TAG' is neither vX.Y.Z nor vX.Y.Z-<suffix>; refusing to release."
            exit 1
          fi
          echo "Tag $TAG: $(cat "$GITHUB_OUTPUT")"

  release:
    needs: [ci, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Go version from go.mod
        id: go
        run: bash scripts/ci/go-version.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Cross-compile, zip, and checksum
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Building Obelisk ${TAG}"
          mkdir -p dist
          # Software escrow: embed this exact tagged source so every built binary
          # can emit its own source tarball into an Escrow Bundle (escrow.go). This
          # OVERWRITES the committed dev placeholder before the build compiles it in.
          git archive --format=tar.gz --prefix="obelisk-${TAG}/" -o escrow/obelisk-src.tar.gz HEAD
          cp "escrow/obelisk-src.tar.gz" "dist/obelisk-src-${TAG}.tar.gz"
          # Pure-Go, static (CGO disabled) binaries for every supported target:
          # Windows (x64, ARM), Linux (x64, ARM), macOS (Intel, Apple Silicon).
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            bin="obelisk-${goos}-${goarch}"
            [ "$goos" = "windows" ] && bin="${bin}.exe"
            stage="staging/${goos}-${goarch}"
            mkdir -p "$stage"
            echo "  -> ${bin}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.appVersion=${TAG}" -o "$stage/$bin" .
            # Every download is self-documenting: the binary plus the hand-restore docs.
            cp README.md LICENSE docs/RESTORE_RUNBOOK.md "$stage/"
            ( cd "$stage" && zip -q -r "../../dist/obelisk-${goos}-${goarch}.zip" . )
          done
          # One checksum file over all release artifacts (zips + the source tarball).
          ( cd dist && sha256sum *.zip *.tar.gz > SHA-256SUMS.txt )
          echo "Artifacts:"; ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.tag.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA-256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Build and push the multi-arch container image (the NAS-side brain) to GHCR.
  image:
    needs: [ci, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push the container image to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Go version from go.mod
        id: go
        run: bash scripts/ci/go-version.sh >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest and :X.Y only for a plain vX.Y.Z tag. flavor latest=false stops the
      # action from adding :latest on its own.
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.tag.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.tag.outputs.prerelease == 'false' }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GO_VERSION=${{ steps.go.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
